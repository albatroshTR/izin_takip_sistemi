# Testler (Linux, pencere açmadan) ve Windows .exe derlemesi.
name: Test ve derleme

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sistem kütüphaneleri (Qt)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Paketler
        run: python -m pip install -r gereksinimler.txt
      - name: Hak ediş motoru testleri
        run: python testler/test_hesapla.py
      - name: Uçtan uca testler
        run: python testler/test_uygulama.py

  windows-exe:
    runs-on: windows-latest
    needs: test
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Paketler
        run: python -m pip install -r gereksinimler.txt pyinstaller
      - name: Derle
        run: pyinstaller --noconfirm --clean izin_takip.spec
      - name: Programı dene (şifreli veri dosyası, örnek veri, bütün ekranlar)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          IZIN_TAKIP_KULLANICI: deneme
          IZIN_TAKIP_PAROLA: Deneme-${{ github.run_id }}
        run: |
          $exe = Resolve-Path "dist/Izin Takip Sistemi.exe"
          $vt = Join-Path $env:RUNNER_TEMP "vt"
          $p = Start-Process -FilePath $exe -ArgumentList "--veri `"$vt`" --ornek-veri" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Örnek veri çıkış kodu $($p.ExitCode)" }
          $bayt = [System.IO.File]::ReadAllBytes((Join-Path $vt "personel_takip.vt"))
          if ([System.Text.Encoding]::ASCII.GetString($bayt, 0, 4) -ne "IZTS") { throw "Veri dosyası şifreli değil" }
          $ek = Join-Path $env:RUNNER_TEMP "ekran"
          $p = Start-Process -FilePath $exe -ArgumentList "--veri `"$vt`" --tarih 2026-10-25 --ekran-goruntusu `"$ek`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Ekran sınaması çıkış kodu $($p.ExitCode)" }
          if ((Get-ChildItem $ek -Filter *.png).Count -lt 20) { throw "Ekran görüntüsü eksik" }
      - uses: actions/upload-artifact@v4
        with:
          name: Izin-Takip-Sistemi-Windows
          path: dist/Izin Takip Sistemi.exe
          retention-days: 90
